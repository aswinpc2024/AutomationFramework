version: '3.8'

services:
#  chrome:
#    image: selenium/standalone-chrome
#    ports:
#      - "4444:4444"

  hlm-backend:
    image: healenium/hlm-backend:3.4.9
    ports:
      - "7878:7878"
    environment:
      - spring.datasource.url=jdbc:postgresql://postgres:5432/healenium
      - spring.datasource.username=healenium
      - spring.datasource.password=healenium
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: healenium
      POSTGRES_USER: healenium
      POSTGRES_PASSWORD: healenium
